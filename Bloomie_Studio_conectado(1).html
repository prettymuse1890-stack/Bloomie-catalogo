<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloomie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Pacifico&family=Dancing+Script:wght@700&family=Lobster&family=Quicksand:wght@400;700&family=Poppins:wght@400;700&family=Caveat:wght@400;700&family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4ee;--card:#fff;--ink:#2a1f2d;--mut:#7d6f78;--acc:#b8336a;--acc2:#fff;--ln:#eadbd3;--soft:#f4e6e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1720;--card:#2a2230;--ink:#f6ecef;--mut:#b5a5af;--acc:#f07fae;--acc2:#2a1020;--ln:#3d3243;--soft:#33283a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1720;--card:#2a2230;--ink:#f6ecef;--mut:#b5a5af;--acc:#f07fae;--acc2:#2a1020;--ln:#3d3243;--soft:#33283a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf,Georgia,serif)}
button,input{font:inherit;color:inherit}
body{max-width:520px;margin:0 auto;min-height:100%}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header b{flex:1;font-size:18px}
.ib{border:1px solid var(--ln);background:var(--card);border-radius:999px;min-width:40px;height:40px;padding:0 12px;cursor:pointer}
main{padding:6px 16px 24px;position:relative;z-index:1}
h1,h2,h3{margin:0 0 6px;line-height:1.15}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
.mut{color:var(--mut);font-size:14px}
.btn{display:block;width:100%;border:0;background:var(--acc);color:var(--acc2);padding:14px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--ink);font-weight:400}
.win{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px;margin-top:18px;box-shadow:6px 6px 0 var(--acc);text-align:center}
.ph{position:relative;background:var(--soft);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;font-size:34px;color:var(--mut)}
.ph.big{aspect-ratio:4/5}.ph.hero{aspect-ratio:1/1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ed{cursor:pointer;outline:2px dashed var(--acc)}
.ph i{position:absolute;bottom:6px;left:6px;font:12px system-ui;background:var(--acc);color:var(--acc2);padding:3px 8px;border-radius:8px}
.cards{display:grid;gap:14px;margin-top:14px}
.szc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;cursor:pointer}
.szc.e{cursor:default}
.in{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:8px 10px;margin:4px 0}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px}
.pr{font-size:18px;color:var(--acc);font-weight:700;margin-bottom:8px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);cursor:pointer;padding:0}
.dot.on{outline:3px solid var(--acc);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.crow{display:flex;gap:6px;align-items:center}
.crow input[type=color]{width:42px;height:36px;border:0;padding:0;background:none;flex:none}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-top:10px}
.item .ph{width:56px;aspect-ratio:1;flex:none;font-size:18px}
.item div.t{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);cursor:pointer}
footer{position:relative;z-index:1;padding:10px 16px 30px;display:flex;gap:14px;justify-content:center}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px}
.ban{background:var(--acc);color:var(--acc2);font:13px system-ui;padding:8px 14px;text-align:center}
.mem{display:flex;gap:12px;flex-wrap:wrap;font:14px system-ui;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:14px system-ui;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco span{position:absolute;opacity:.4}
.win::before,.win::after{position:absolute;font-size:30px;top:-18px}
.win::before{content:var(--dec,"");left:-10px;transform:rotate(-15deg)}
.win::after{content:var(--dec2,"");right:-10px;transform:rotate(15deg)}
main h2::after{content:" " var(--dec,"")}
.brand{font-size:44px;text-align:center;margin:18px 0 16px;letter-spacing:-.5px}
.hb{position:relative;margin-top:14px;cursor:pointer}.hb.e{cursor:default}
.hb .ph.hero{aspect-ratio:1/1}
.lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:26px;font-weight:700;color:#fff;background:rgba(0,0,0,.4);border-radius:14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cdet{border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin:8px 0}.cdet summary{cursor:pointer;font:600 14px system-ui}
.warn{background:var(--soft);border:1px solid var(--acc);border-radius:12px;padding:10px;margin-top:10px;font:14px system-ui}.btn.off{opacity:.45}
h1,h2,h3,.brand,.lb,header b{font-family:var(--hf,Georgia,serif)}
.ib.on{outline:3px solid var(--acc)}
.stk{font:600 14px system-ui;color:var(--acc);margin:2px 0 6px}.stk.out{color:#c0392b}.btn:disabled{opacity:.45;cursor:not-allowed}textarea.in{font:12px monospace}
.dot.out{background-image:linear-gradient(to top right,transparent 44%,#c0392b 44%,#c0392b 56%,transparent 56%);opacity:.55}.ib.out{opacity:.5;text-decoration:line-through}
.tag{text-align:center;color:var(--mut);margin-top:22px;font-size:15px}
</style></head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ===== CONFIGURA AQUÍ (solo estas 3 cosas, entre las comillas) ===== */
const CFG={wa:'',sheet:'https://docs.google.com/spreadsheets/d/1FHlr9YH3aheQAbaeJbxBGLTpzBZM-Rl2uv14WXRQ5zs/edit',api:'',ig:'',edit:true};
/* wa: tu número con código de país, sin + ni espacios (ej. 521234567890)
   sheet: el enlace de tu hoja de Google Sheets (debe estar compartida como "cualquier persona con el enlace puede ver")
   ig: tu usuario de Instagram, sin @
   edit: true = aparece el botón "Editar catálogo"; false = no aparece (usa false para la página final) */
/* ============================================================ */
const KEY='bloomie_v1';
const mk=()=>[['Pequeño',[['k0_0','Self love'],['k1795654757244','Just pretty']]],['Mediano',[['k1_0','Sweet kiss'],['k1_1','Essencial honey'],['k1_2','Purple magic']]],['Grande',[['k2_0','Soft beauty'],['k2_1','Barbie vibe']]]].map(([n,it])=>({n,d:'Kits '+n.toLowerCase()+'s',img:'',items:it.map(([id,nm])=>({id,n:nm,d:'Describe qué incluye',img:'',price:0}))}));
const CL={'Rosa':'#f4a6c0','Rojo':'#e0474c','Lila':'#d9b8ee','Morado':'#a58be0','Durazno':'#ffcba4','Azul':'#8fb8e8','Amarillo':'#f7d55c','Verde':'#9fd6a8','Blanco':'#ffffff','Rosa carmesí':'#d6336c','Rosa carmesi':'#d6336c','Fresa':'#e8506a','Uva':'#7b4b94','Piña':'#f6c945','Sandia':'#f0506e','Marrón':'#8b5e3c','Beige':'#e8d5b7','Naranja':'#f2994a','Rosa fuerte':'#e8458c','Rojo vino':'#722f37','Rosa claro':'#f8c8dc'};
const pr=(id,n,cs,t)=>({id,n,p:0,img:'',c:(cs||[]).map(x=>({n:x,h:CL[x]||'#cccccc'})),...(t?{t}:{})});
const dflt=()=>({v:3,biz:'Bloomie Studio',tag:'accesorios • cosméticos • creatividad',b1:'Kits predeterminados',b1i:'',b2:'Personalizados',b2i:'',ks:mk(),sheet:'',api:'',st:{},theme:{acc:'#b8336a',bg:'#fbf4ee',emo:'🌸🌷✨'},wa:'521234567890',
sizes:[{n:'Pequeño',d:'Ideal para regalar',img:'',min:3,ids:[1,2,3,4]},{n:'Mediano',d:'Perfecto para compartir',img:'',min:5,ids:[7,8,9,10,20,21]},{n:'Grande',d:'El pedido completo',img:'',min:7,ids:[11,12,13,14,15,17,22,23,24,25]}],
products:[pr(1,'Clear lip gloss'),pr(2,'Gloss de brillo',['Rosa','Rojo','Lila','Morado','Durazno']),pr(3,'Fat oil',['Rosa','Morado']),pr(4,'Mini gancho hawaiano',['Amarillo','Verde','Rosa','Blanco','Azul','Rosa carmesí']),pr(7,'Honey lip oil'),pr(8,'Strawberry balm'),pr(9,'Lip tint'),pr(10,'Máscara'),pr(11,'jelly tint'),pr(12,'Magic gloss',['Fresa','Uva','Piña','Sandia']),pr(13,'Vendas',['Azul','Marrón','Rojo','Beige']),pr(14,'Espejitos de mano'),pr(15,'Clip hawaiano',['Rosa','Naranja','Amarillo','Verde','Morado','Rosa fuerte','Blanco','Azul']),pr(17,'Crema de manos ✨sorpresa✨'),pr(20,'Liga de satin',['Blanco','Morado','Azul','Rojo vino']),pr(21,'Parche para acne ✨Sorpresa✨'),pr(22,'Lip liner'),pr(23,'Cherry lip gloss'),pr(24,'Gancho hawaiano',['Amarillo','Verde','Azul','Blanco','Rosa claro','Rosa carmesi'],['Pequeño','Grande']),pr(25,'Cepillitos para cejas')]});
let S;try{S=Object.assign(dflt(),CFG.edit===false?{}:(JSON.parse(localStorage.getItem(KEY))||{}))}catch(e){S=dflt()}
if(CFG.wa)S.wa=CFG.wa;if(CFG.sheet)S.sheet=CFG.sheet;if(CFG.api)S.api=CFG.api;if(CFG.ig)S.ig=CFG.ig;
S.ks.forEach(z=>z.items.forEach(k=>{if(typeof k.price!=='number')k.price=0}));S.products.forEach(p=>{if(typeof p.p!=='number')p.p=0});
S.theme=Object.assign({hf:'Georgia',bf:'Georgia',acc:'#b8336a',bg:'#fbf4ee',emo:'🌸🌷✨'},S.theme||{});
if(!S.v||S.v<2){S.sizes.forEach((z,k)=>{z.ids=[1,2,3,4,5,6,7,8,9].slice(0,[4,6,9][k]);z.min=[3,5,7][k]});S.v=2}
if((S.v||0)<3){while(S.products.length<19){const id=Math.max(0,...S.products.map(p=>p.id))+1;S.products.push({id,n:'Producto '+id,p:100,img:'',c:[{n:'Rosa',h:'#f4a6c0'},{n:'Azul',h:'#8fb8e8'},{n:'Verde',h:'#9fd6a8'}]})}
const ids=S.products.map(p=>p.id);S.sizes.forEach((z,k)=>{z.ids=ids.slice([0,4,10][k],k===2?undefined:[4,10][k])});S.v=3}
let cname='',waF=null,kz=0,openC=null,writePin='';
let edit=false,view='home',sz=0,cart=[],sel={},selT={},cur=0,prev='sizes';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const igu=()=>(S.ig||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/[\/?].*$/,'');
const money=n=>'$'+(+n||0).toLocaleString('es-MX');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: fotos muy pesadas')}};
const set=(path,v)=>{const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
const img=(path,url,cls)=>`<div class="ph ${cls||''} ${edit?'ed':''}" ${edit?`data-img="${path}"`:''}>${url?`<img src="${url}" alt="">`:'<span>📷</span>'}${edit?'<i>Cambiar foto</i>':''}</div>`;
const inp=(path,v,ph,n)=>edit?`<input class="in" data-f="${path}" value="${esc(v)}" placeholder="${ph||''}" ${n?'type="number" inputmode="decimal"':''}>`:esc(v);
const priceEditor=(code,value)=>edit?`<label class="mut" style="display:block;margin-top:8px">Precio interno (RD$)</label><input class="in" type="number" min="0" step="1" inputmode="decimal" data-pricecode="${esc(code)}" value="${Number(value)||0}" placeholder="0">`:`<div class="mut">Precio: Consultar por privado</div>`;
function pick(cb){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(!f.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
const list=()=>sz>=0?S.products.filter(p=>S.sizes[sz].ids.includes(p.id)):S.products;
const QC=[['Rosa','#f4a6c0'],['Rojo','#e0474c'],['Naranja','#f2994a'],['Amarillo','#f7d55c'],['Verde','#9fd6a8'],['Turquesa','#5ec8c0'],['Azul','#8fb8e8'],['Morado','#a58be0'],['Lila','#d9b8ee'],['Blanco','#ffffff'],['Negro','#2b2b2b'],['Dorado','#d4af37'],['Plateado','#c0c0c0'],['Café','#8b5e3c']];
const ccode=(p,n)=>'p'+p.id+'|'+n;
const jc=p=>{const s=sel[p.id];if(s!==undefined)return s;const k=p.c.findIndex(x=>av(ccode(p,x.n)));return k<0?0:k};
const jtz=p=>{const s=selT[p.id];if(s!==undefined)return s;const k=(p.t||[]).findIndex(x=>av(ccode(p,x)));return k<0?0:k};
const TQ=['Chico','Mediano','Grande','S','M','L','XL','Único'];
const mn=k=>S.sizes[k].min??[3,5,7][k];
const mx=k=>{const v=S.sizes[k].max??[0,7,9][k];return v>0?v:1e9};
const ex=p=>p.ex===undefined?/cepill\w*\s+(para\s+)?cejas/i.test(p.n):!!p.ex;
const have=k=>cart.filter(c=>!c.kit&&c.z===k).reduce((a,c)=>{const p=S.products.find(x=>x.id===c.id);return a+(p&&ex(p)?0:c.q)},0);
const need=()=>S.sizes.map((z,k)=>({z:z.n,q:have(k),m:mn(k),u:cart.some(c=>!c.kit&&c.z===k)})).filter(x=>x.u&&x.q<x.m);
const findKit=id=>{for(const z of S.ks){const k=z.items.find(x=>x.id===id);if(k)return k}};
const count=()=>cart.reduce((a,b)=>a+b.q,0);
let stock={},sheetOK=false;
let pend=null;const ask=k=>{if(pend===k){pend=null;return true}pend=k;toast('Toca otra vez para confirmar');setTimeout(()=>{if(pend===k)pend=null},3000);return false};
const av=c=>{const v=sheetOK&&stock[c]!==undefined?stock[c]:S.st[c];return !(v===false||v===0)};
const stline=c=>`<div class="stk ${av(c)?'':'out'}">${av(c)?'Disponible':'Agotado'}</div>`+(edit?`<div class="mut">Código para tu hoja: <b>${c}</b></div><label class="mut"><input type="checkbox" data-act="avl" data-c="${c}" ${av(c)?'checked':''}> Disponible (si no usas Sheets)</label>`:'');
const codes=()=>S.ks.flatMap(z=>z.items.map(k=>[k.id,k.n,av(k.id)?'Disponible':'Agotado'])).concat(S.products.map(p=>['p'+p.id,p.n,av('p'+p.id)?'Disponible':'Agotado'])).concat(S.products.flatMap(p=>p.c.map(x=>[ccode(p,x.n),p.n+' · color '+x.n,av(ccode(p,x.n))?'Disponible':'Agotado']).concat((p.t||[]).map(x=>[ccode(p,x),p.n+' · tamaño '+x,av(ccode(p,x))?'Disponible':'Agotado'])))).map(r=>[r[0],r[1],r[0].startsWith('k')?'Kit':'Producto',r[2],0].join('\t')).join('\n');
const exp=()=>JSON.stringify(S,(k,v)=>typeof v==='string'&&v.startsWith('data:')?'(foto)':v);
const csvp=t=>{const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}return R};
function sheetJSONP(){return new Promise((resolve,reject)=>{
 if(!S.api){reject(new Error('Falta la URL de Apps Script'));return}
 const cb='__bloomie_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
 const sc=document.createElement('script');let done=false;
 const finish=(err,data)=>{if(done)return;done=true;delete window[cb];sc.remove();err?reject(err):resolve(data)};
 window[cb]=data=>finish(null,data);sc.onerror=()=>finish(new Error('No se pudo leer Apps Script'));
 sc.src=S.api+(S.api.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
 document.head.appendChild(sc);setTimeout(()=>finish(new Error('Tiempo de espera agotado')),12000);
 })}
function setLocalPrice(code,value){const n=Math.max(0,Number(value)||0);if(/^p\d+$/.test(code)){const p=S.products.find(x=>'p'+x.id===code);if(p)p.p=n;return}for(const z of S.ks){const k=z.items.find(x=>x.id===code);if(k){k.price=n;return}}}
async function pushSheetChange(code,change){if(!S.api){toast('Primero configura la URL de Apps Script');return}if(!writePin){toast('Escribe el PIN de sincronización en Inicio');return}
 try{await fetch(S.api,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:writePin,code, ...change})});toast('Enviando cambio a Google Sheets…');setTimeout(()=>loadStock(),1800)}catch(e){toast('No se pudo enviar el cambio a Sheets')}}
async function loadStock(){if(!S.sheet)return;try{
 if(S.api){const data=await sheetJSONP();if(!data||data.ok!==true)throw new Error('Respuesta no válida');stock={};const prices={};(data.items||[]).forEach(x=>{if(!x.code)return;stock[x.code]=!['agotado','0','false','no'].includes(String(x.availability||'').trim().toLowerCase());prices[x.code]=Number(x.price)||0});
 S.products.forEach(p=>{if(prices['p'+p.id]!==undefined)p.p=prices['p'+p.id]});S.ks.forEach(z=>z.items.forEach(k=>{if(prices[k.id]!==undefined)k.price=prices[k.id]}));sheetOK=true;
 }else{const m=/spreadsheets\/d\/([\w-]+)/.exec(S.sheet);if(!m)throw new Error('Enlace de hoja no válido');const r=await fetch('https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv&t='+Date.now());const rows=csvp(await r.text()),hd=rows[0]||[];let ci=hd.findIndex(x=>/disponib|estado|stock/i.test(x));if(ci<0)ci=3;let pi=hd.findIndex(x=>/precio|price/i.test(x));const o={};rows.slice(1).forEach(x=>{if(x[0]){o[x[0].trim()]=!['agotado','0'].includes(String(x[ci]||'').trim().toLowerCase());if(pi>=0)setLocalPrice(x[0].trim(),x[pi])}});stock=o;sheetOK=true}
 if(!edit&&view!=='cart')render()}catch(e){sheetOK=false;if(edit)toast('No se pudo conectar con Google Sheets')}}


function slide(p){const i=S.products.indexOf(p),j=jc(p),c=p.c[j]||p.c[0];

 else if(act==='dec'){const c=cart[+D.k];c.q--;if(c.q<1)cart.splice(+D.k,1)}
 else if(act==='clear')cart=[];
 else if(act==='prev'||act==='next'){const t=$('.track');if(t)t.scrollBy({left:(act==='next'?1:-1)*t.clientWidth,behavior:'smooth'});return}
 else if(act==='st'){const p=S.products.find(x=>x.id===+D.id),x=(p.t||[])[+D.j];if(x&&!av(ccode(p,x)))toast('Ese tamaño está agotado');else selT[+D.id]=+D.j}
 else if(act==='addt'){const p=S.products[+D.i];p.t=(p.t||[]).concat('Nuevo');save()}
 else if(act==='delt'){S.products[+D.i].t.splice(+D.j,1);save()}
 else if(act==='qt'){const p=S.products[+D.i];p.t=(p.t||[]).concat(TQ[+D.k]);save()}
 else if(act==='allt'){if(ask('allt'+D.i)){const t=S.products[+D.i].t||[];S.products.forEach(p=>p.t=t.slice());save()}}
 else if(act==='hf'){S.theme.hf=D.n;save()}
 else if(act==='bf'){S.theme.bf=D.n;save()}
 else if(act==='pre'){const p=PRE[+D.k];S.theme.acc=p[0];S.theme.bg=p[1];save()}
 else if(act==='emo'){S.theme.emo=+D.k>=0?EM[+D.k]:'';save()}
 else if(act==='edit'&&CFG.edit!==false)edit=!edit;
 else if(act==='reset'){if(ask('reset')){S=dflt();save()}}
 else if(act==='addc'){S.products[+D.i].c.push({n:'Nuevo',h:'#cccccc'});save()}
 else if(act==='delc'){S.products[+D.i].c.splice(+D.j,1);save()}
 else if(act==='qc'){const q=QC[+D.k];S.products[+D.i].c.push({n:q[0],h:q[1]});save()}
 else if(act==='allc'){if(ask('allc'+D.i)){const c=S.products[+D.i].c;S.products.forEach(p=>p.c=c.map(x=>({...x})));save()}}
 else if(act==='addp'){const id=Math.max(0,...S.products.map(p=>p.id))+1;S.products.push({id,n:'Producto nuevo',p:0,img:'',c:[{n:'Rosa',h:'#f4a6c0'}]});if(sz>=0)S.sizes[sz].ids.push(id);save();cur=sz>=0?S.sizes[sz].ids.length-1:S.products.length-1}
 else if(act==='delp'){if(ask('p'+D.i)){const p=S.products[+D.i];S.products.splice(+D.i,1);S.sizes.forEach(s=>s.ids=s.ids.filter(x=>x!==p.id));cart=cart.filter(c=>c.id!==p.id);save();cur=Math.max(0,cur-1)}}
 if(['go','open','kopen'].includes(act))loadStock();
 render();
});
render();loadStock();
</script></body></html>
